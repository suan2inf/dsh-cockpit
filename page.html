<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Cockpit · 管理中心</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --text: #1f2328; --dim: #6b7280;
    --border: #e5e7eb; --ok: #1a7f37; --warn: #b26a00; --err: #cf222e; --info: #0969da;
    --brand: #4f6ef7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --card: #1c1f26; --text: #e6e8eb; --dim: #9aa0aa;
      --border: #2c313a; --ok: #3fb950; --warn: #d29922; --err: #f85149; --info: #58a6ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  .gate { border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--card); }
  .gate.ok { border-color: var(--ok); color: var(--ok); }
  .gate.error { border-color: var(--err); color: var(--err); }
  .gate.info { border-color: var(--info); color: var(--text); }
  .gate .detail { font-weight: 400; white-space: pre-wrap; margin-top: 6px; color: var(--text); }
  .counts { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 8px; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; margin-right: 8px; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }
  .badge.error { color: var(--err); } .badge.info { color: var(--info); }
  pre { margin: 8px 0 0; font-size: 12px; color: var(--dim); white-space: pre-wrap; word-break: break-all; }
  pre.remedy { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); font-size: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .bad { color: var(--err); } .dim { color: var(--dim); }
  button { font: inherit; border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 6px; padding: 6px 14px; cursor: pointer; margin: 0 8px 8px 0; }
  button:hover { border-color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
  .fixhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DSH Cockpit · 管理中心</h1>
  <div class="sub" id="meta">加载中…</div>

  <div>
    <button onclick="loadAll(false)">重新体检</button>
    <button onclick="loadAll(true)">在线检查</button>
  </div>

  <h2>体检</h2>
  <div id="gate"></div>
  <div class="counts" id="counts"></div>
  <div id="checks"></div>

  <h2>更新</h2>
  <div class="card">
    <div class="kv">
      <span class="dim">当前版本</span><b id="upCurrent">?</b>
      <span class="dim">上游最新</span><b id="upLatest">尚未获取</b>
      <span class="dim">落后提交</span><b id="upBehind">尚未获取</b>
    </div>
    <div style="margin-top:10px">
      <button onclick="loadPreview()" id="btnPreview">获取更新预览（联网）</button>
      <button class="primary" onclick="launchUpdate()">开始更新</button>
    </div>
    <div id="launchMsg"></div>
  </div>
  <div id="preview"></div>

  <h2>修复</h2>
  <div id="fixes" class="dim">加载中…</div>

  <h2>插件兼容性</h2>
  <div id="plugins"></div>
</div>

<script>
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
async function api(path, method) {
  const res = await fetch(path, { method: method || 'GET' });
  return res.json();
}

async function loadAll(online) {
  document.getElementById('meta').textContent = '体检中…';
  try {
    const results = await Promise.all([
      api('/dsh-cockpit/api/report' + (online ? '?online=1' : '')),
      api('/dsh-cockpit/api/fixes'),
    ]);
    renderReport(results[0]);
    renderFixes(results[1].fixes || []);
  } catch (e) {
    document.getElementById('meta').textContent = '体检失败: ' + e;
  }
}

function renderReport(r) {
  document.getElementById('meta').textContent =
    '版本 ' + (r.dshVersion || '?') + ' · ' + r.startedAt + ' · ' + r.repo;
  document.getElementById('upCurrent').textContent = r.dshVersion || '?';
  const gate = document.getElementById('gate');
  gate.className = 'gate ' + r.gate.level;
  gate.innerHTML = '更新门禁：' + esc(r.gate.title) +
    (r.gate.detail ? '<div class="detail">' + esc(r.gate.detail) + '</div>' : '');
  document.getElementById('counts').innerHTML =
    ['ok', 'info', 'warn', 'error'].map((k) =>
      '<span class="card"><span class="badge ' + k + '">' + k.toUpperCase() +
      '</span>' + (r.summary[k] || 0) + '</span>').join('');
  const order = { error: 0, warn: 1, info: 2, ok: 3 };
  const checks = r.checks.slice().sort((a, b) => order[a.level] - order[b.level]);
  document.getElementById('checks').innerHTML = checks.map((c) =>
    '<div class="card"><span class="badge ' + c.level + '">' + c.level.toUpperCase() +
    '</span>' + esc(c.title) +
    (c.detail && c.level !== 'ok' ? '<pre>' + esc(c.detail) + '</pre>' : '') +
    (c.remedy ? '<pre class="remedy">→ ' + esc(c.remedy) + '</pre>' : '') +
    '</div>').join('');
  const rows = (r.plugins || []).map((p) =>
    '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.installed) + '</td>' +
    '<td>' + (p.enabled === null ? '<span class="dim">未知</span>' : p.enabled ? '启用' : '<span class="dim">禁用</span>') + '</td>' +
    '<td>' + (p.peerIssues.length ? '<span class="bad">' + esc(p.peerIssues.join('; ')) + '</span>'
      : '<span class="dim">兼容声明覆盖当前版本</span>') +
    (p.compatNote ? '<div class="dim">' + esc(p.compatNote) + '</div>' : '') + '</td></tr>').join('');
  document.getElementById('plugins').innerHTML = rows
    ? '<table><tr><th>插件</th><th>已装版本</th><th>状态</th><th>兼容性</th></tr>' + rows + '</table>'
    : '<div class="dim">未安装第三方插件。</div>';
}

function renderFixes(fixes) {
  document.getElementById('fixes').innerHTML = fixes.map((f) =>
    '<div class="card"><div class="fixhead">' +
    '<span class="badge ' + (f.needed ? 'warn' : 'ok') + '">' + (f.needed ? '需要修' : '正常') + '</span>' +
    '<b>' + esc(f.title) + '</b><span class="dim">' + (f.risk === 'low' ? '低风险' : '中风险') + '</span></div>' +
    '<div class="dim">' + esc(f.description) + '</div>' +
    '<div class="dim" style="margin-top:4px">' + esc(f.note) + '</div>' +
    '<div style="margin-top:8px"><button data-fix="' + esc(f.id) + '"' + (f.needed ? ' class="primary"' : '') +
    ' onclick="runFix(this)">执行修复</button></div>' +
    '<pre id="fixres-' + esc(f.id) + '"></pre></div>').join('');
}

async function runFix(btn) {
  const id = btn.getAttribute('data-fix');
  btn.disabled = true;
  btn.textContent = '修复中…';
  const out = document.getElementById('fixres-' + id);
  try {
    const r = await api('/dsh-cockpit/api/fix/' + encodeURIComponent(id), 'POST');
    const res = r.result || { ok: false, message: r.error || '未知结果' };
    out.style.color = res.ok ? 'var(--ok)' : 'var(--err)';
    out.textContent = (res.ok ? '✓ ' : '✗ ') + res.message + (res.details ? '\n' + res.details : '');
  } catch (e) {
    out.style.color = 'var(--err)';
    out.textContent = '✗ ' + e;
  }
  btn.disabled = false;
  btn.textContent = '执行修复';
  loadAll(false);
}

async function loadPreview() {
  const btn = document.getElementById('btnPreview');
  btn.disabled = true;
  btn.textContent = '正在拉取上游信息…';
  try {
    const r = await api('/dsh-cockpit/api/update-preview');
    const p = r.preview || {};
    document.getElementById('upLatest').textContent = p.latest ? p.latest.version : (p.error || '获取失败');
    document.getElementById('upBehind').textContent = (p.behind === null || p.behind === undefined) ? '未知' : String(p.behind);
    if (p.latest) {
      document.getElementById('preview').innerHTML =
        (p.latest.notesUnavailable
          ? '<div class="card dim">发布说明未能自动拉取（GitHub API 直连不可达），可在浏览器打开查看：<a href="' + esc(p.latest.url) + '" target="_blank" rel="noreferrer">' + esc(p.latest.url) + '</a></div>' : '') +
        (p.latest.breaking && p.latest.breaking.length
          ? '<div class="card"><b style="color:var(--warn)">需要特别注意的变更</b><pre>' + esc(p.latest.breaking.join('\n')) + '</pre></div>' : '') +
        (p.latest.bullets && p.latest.bullets.length
          ? '<div class="card"><b>发布说明摘要</b><pre>' + esc(p.latest.bullets.join('\n')) + '</pre></div>' : '');
    } else if (p.error) {
      document.getElementById('preview').innerHTML = '<div class="card" style="color:var(--warn)">' + esc(p.error) + '</div>';
    }
  } catch (e) {
    document.getElementById('preview').innerHTML = '<div class="card" style="color:var(--err)">' + esc(String(e)) + '</div>';
  }
  btn.disabled = false;
  btn.textContent = '获取更新预览（联网）';
}

async function launchUpdate() {
  if (!confirm('将打开「更新助手」窗口：\n\n1. 你关闭运行 DSH Web 的控制台窗口\n2. 更新自动进行（本地修复会自动备份并重放）\n3. 完成后自动重新启动 DSH Web\n\n继续？')) return;
  try {
    const r = await api('/dsh-cockpit/api/update/launch', 'POST');
    document.getElementById('launchMsg').innerHTML =
      '<pre style="color:var(--ok)">' + esc(r.hint || r.error || JSON.stringify(r)) + '</pre>';
  } catch (e) {
    document.getElementById('launchMsg').innerHTML =
      '<pre style="color:var(--err)">' + esc(String(e)) + '</pre>';
  }
}

loadAll(false);
</script>
</body>
</html>
